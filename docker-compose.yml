version: '3.8'

services:
  # 1. Contenedor de la Base de Datos (PostgreSQL)
  db:
    image: postgres:15
    container_name: elysium_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password_seguro
      POSTGRES_DB: elysium_agenda
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d elysium_agenda"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Contenedor del Backend (Python / FastAPI)
  backend:
    build: ./backend
    container_name: elysium_backend
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://admin:password_seguro@db:5432/elysium_agenda
      # Runtime connection for Row-Level Security — non-superuser role, must
      # be bootstrapped once via backend/scripts/bootstrap_app_role.sql
      # (password below must match what you set there for local dev).
      - APP_DATABASE_URL=postgresql://app_user:app_user_dev_pw@db:5432/elysium_agenda
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      # Superadmin panel (Fase 3) — secreto de firma SEPARADO del de los tenants,
      # a propósito distinto acá para que dev ejercite la aislación por firma.
      - SUPERADMIN_JWT_SECRET=dev-superadmin-secret-change-in-production
      # Email (local dev leaves these blank → emails go to the log, not sent)
      - GMAIL_USER=
      - GMAIL_APP_PASSWORD=
    volumes:
      - ./backend:/app

  # 3. Contenedor del Frontend (React.js)
  frontend:
    build: ./frontend
    container_name: elysium_frontend
    command: npm start
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:8000
      # Dev-only: localhost has no real subdomain, so this tells the backend
      # which tenant to resolve (TenantMiddleware honors X-Tenant-Slug only
      # when RAILWAY_ENVIRONMENT != "production"). See frontend/src/config/runtime.js.
      - REACT_APP_DEV_TENANT_SLUG=elysium
      # Only used outside localhost (see runtime.js) — harmless placeholder here.
      - REACT_APP_BASE_DOMAIN=localhost
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
